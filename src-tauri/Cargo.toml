[package]
name = "sedjem"
version = "0.1.0"
description = "Sedjem — floating push-to-talk dictation powered by local Whisper"
edition = "2021"
license = "MIT"
repository = "https://github.com/enverkaradede/sedjem"
authors = ["Enver Karadede"]
rust-version = "1.85"

[lib]
name = "sedjem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "=2.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.18"
rubato = "5"
whisper-rs = { version = "0.16", features = ["metal", "tracing_backend"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "native-tls"] }
sha2 = "0.11"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString"] }
security-framework = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
